name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Security rules tests
        run: npm run test:rules

      - name: Support API tests
        run: node --import tsx --test tests/support-chat.test.mjs

      - name: Browser storage regression tests
        run: node --import tsx --test tests/browser-storage.test.mjs

      - name: Listing data regression tests
        run: node --import tsx --test tests/listing-data.test.mjs

      - name: Production inventory regression tests
        run: node --test tests/production-inventory.test.mjs

      - name: Progressive pagination regression tests
        run: node --test tests/progressive-pagination.test.mjs

      - name: Cursor pagination regression tests
        run: node --test tests/cursor-pagination.test.mjs

      - name: Public listing ID regression tests
        run: node --import tsx --test tests/public-listing-id.test.mjs

      - name: Branding regression tests
        run: node --test tests/branding-regression.test.mjs

      - name: SEO metadata regression tests
        run: node --import tsx --test tests/meta-tags.test.mjs

      - name: Launch hardening regression tests
        run: node --import tsx --test tests/launch-hardening.test.mjs

      - name: Error boundary regression tests
        run: node --import tsx --test tests/error-boundary.test.mjs

      - name: Service worker regression tests
        run: node --test tests/service-worker.test.mjs

      - name: Typecheck
        run: npm run lint

      - name: Production build
        run: npm run build
