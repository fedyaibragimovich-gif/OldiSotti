name: Live marketplace E2E

on:
  workflow_dispatch:
  push:
    branches:
      - test/live-e2e-20260914
    paths:
      - tests/live-e2e.mjs
      - .github/workflows/live-e2e.yml

permissions:
  contents: read

jobs:
  live-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: https://fedyaibragimovich-gif.vercel.app
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install project and E2E dependencies
        run: |
          npm ci
          npm install --no-save playwright firebase-admin

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run live production E2E
        run: node tests/live-e2e.mjs

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-e2e-${{ github.run_id }}
          path: artifacts/live-e2e
          if-no-files-found: warn
          retention-days: 7
