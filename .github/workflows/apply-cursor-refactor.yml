name: Apply cursor pagination refactor

on:
  push:
    branches:
      - feat/launch-hardening-e2e-20260916
    paths:
      - scripts/apply-cursor-pagination.mjs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/launch-hardening-e2e-20260916
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Apply deterministic source refactor
        run: node scripts/apply-cursor-pagination.mjs
      - name: Commit generated source changes
        run: |
          if git diff --quiet; then
            echo "No cursor refactor changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/lib/firebase.ts tests/cursor-pagination.test.mjs .github/workflows/ci.yml
          git commit -m "Use Firestore startAfter cursor pagination"
          git push origin HEAD:feat/launch-hardening-e2e-20260916
